name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATA_SUBJECT_HTTP_FIXTURE: "1"
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Check benchmark types and behavior
        run: npm run bench:check && npm run bench:smoke

  compatibility:
    name: Packed PostgreSQL (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [nest10-prisma5, nest11-prisma7]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: data_subject
          POSTGRES_PASSWORD: data_subject_test
          POSTGRES_DB: data_subject
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_subject -d data_subject"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://data_subject:data_subject_test@localhost:5432/data_subject
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npm run test:compatibility -- ${{ matrix.profile }}

  composition:
    name: Pinned nestarc composition (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: data_subject
          POSTGRES_PASSWORD: data_subject_test
          POSTGRES_DB: data_subject
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_subject -d data_subject"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://data_subject:data_subject_test@localhost:5432/data_subject
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npm run test:composition
